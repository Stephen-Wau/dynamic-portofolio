<aside class="sidebar">
  <div class="sidebar__profile">
    <div class="sidebar__avatar">
      <img *ngIf="profileService.image() as image" [src]="image" alt="Foto profil" />
      <span *ngIf="!profileService.image()">{{ (user?.username ?? '?').charAt(0).toUpperCase() }}</span>
    </div>
    <p class="sidebar__username">{{ user?.username ?? 'Loading...' }}</p>
    <app-button variant="ghost" (click)="logout()">
      <lucide-icon name="log-out" [size]="16"></lucide-icon>
      Logout
    </app-button>
  </div>

  <nav class="sidebar__menu">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.path"
      routerLinkActive="sidebar__menu-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar__menu-item"
    >
      <lucide-icon *ngIf="item.icon === 'dashboard'" name="layout-dashboard" [size]="18"></lucide-icon>
      <lucide-icon *ngIf="item.icon === 'profile'" name="user" [size]="18"></lucide-icon>
      <lucide-icon *ngIf="item.icon === 'work-histories'" name="briefcase" [size]="18"></lucide-icon>
      <lucide-icon *ngIf="item.icon === 'education'" name="graduation-cap" [size]="18"></lucide-icon>
      <lucide-icon *ngIf="item.icon === 'skills'" name="star" [size]="18"></lucide-icon>
      {{ item.label }}
    </a>
  </nav>
</aside>
