<div class="landing-shell__loader" *ngIf="isLoading">
  <div class="landing-shell__spinner"></div>
</div>

<div class="landing-shell__empty" *ngIf="!isLoading && (loadFailed || !data)">
  <div class="landing-shell__empty-panel">
    <p class="landing-shell__eyebrow">Dynamic Portfolio</p>
    <h1>Landing page portfolio belum siap ditampilkan</h1>
    <p>
      Pilih featured user dan landing page aktif di menu settings CMS agar halaman publik bisa
      dirender dengan benar.
    </p>
    <a href="/admin-cms/settings">Buka Settings CMS</a>
  </div>
</div>

<app-landing-page-1
  *ngIf="!isLoading && data && activeLandingPage() === 'landing_page_1'"
  [portfolio]="data"
></app-landing-page-1>

<app-landing-page-1
  *ngIf="!isLoading && data && activeLandingPage() !== 'landing_page_1'"
  [portfolio]="data"
></app-landing-page-1>
