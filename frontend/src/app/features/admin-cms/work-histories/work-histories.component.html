<div class="work-histories__header">
  <h1>Work Histories</h1>
  <app-button (click)="openCreateModal()">
    <lucide-icon name="plus" [size]="16"></lucide-icon>
    Add
  </app-button>
</div>

<ng-template #periodeTpl let-row="row">
  {{ formatPeriod($any(row)) }}
</ng-template>

<ng-template #aksiTpl let-row="row">
  <div class="work-histories__actions">
    <app-button variant="ghost" size="sm" (click)="openShowModal($any(row))">
      <lucide-icon name="eye" [size]="14"></lucide-icon>
      Show
    </app-button>
    <app-button variant="ghost" size="sm" (click)="openEditModal($any(row))">
      <lucide-icon name="pencil" [size]="14"></lucide-icon>
      Edit
    </app-button>
    <app-button variant="danger" size="sm" (click)="remove($any(row))">
      <lucide-icon name="trash-2" [size]="14"></lucide-icon>
      Delete
    </app-button>
  </div>
</ng-template>

<app-data-table
  [rows]="histories"
  [columns]="columns"
  [serverSide]="true"
  [totalCount]="totalCount"
  [pageSize]="pageSize"
  (search)="onTableQueryChange($event)"
  (refresh)="loadHistories()"
  searchPlaceholder="Search company..."
  emptyMessage="Belum ada riwayat kerja. Klik &quot;Add&quot; untuk menambahkan."
></app-data-table>

<app-modal
  [open]="isModalOpen"
  [title]="isReadOnly ? 'Detail Riwayat Kerja' : (editingId ? 'Edit Riwayat Kerja' : 'Tambah Riwayat Kerja')"
  (closed)="closeModal()"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-input
      label="Nama Kantor / Tempat Bekerja *"
      formControlName="company_name"
      [errorMessage]="fieldError('company_name')"
    ></app-input>

    <app-input
      label="Posisi / Jabatan *"
      formControlName="position"
      [errorMessage]="fieldError('position')"
    ></app-input>

    <div class="work-histories__date-row">
      <app-month-picker
        label="Mulai *"
        formControlName="start_date"
        [errorMessage]="fieldError('start_date')"
      ></app-month-picker>
      <app-month-picker
        label="Selesai *"
        formControlName="end_date"
        [errorMessage]="fieldError('end_date')"
        *ngIf="!form.get('stillWorking')?.value"
      ></app-month-picker>
    </div>

    <label class="work-histories__checkbox">
      <input type="checkbox" formControlName="stillWorking" />
      Masih bekerja di sini
    </label>

    <div class="work-histories__points">
      <label>Poin Pekerjaan *</label>
      <div formArrayName="points">
        <div
          class="work-histories__point-row"
          *ngFor="let point of points.controls; let i = index"
        >
          <app-input [formControlName]="i" [errorMessage]="pointError(i)"></app-input>
          <button
            type="button"
            class="work-histories__point-remove"
            (click)="removePoint(i)"
            *ngIf="points.length > 1 && !isReadOnly"
          >
            <lucide-icon name="x" [size]="16"></lucide-icon>
          </button>
        </div>
      </div>
      <app-button
        variant="ghost"
        size="sm"
        type="button"
        (click)="addPoint()"
        *ngIf="!isReadOnly"
      >
        <lucide-icon name="plus" [size]="14"></lucide-icon>
        Add Point
      </app-button>
    </div>

    <div class="work-histories__form-actions">
      <app-button variant="ghost" type="button" (click)="closeModal()">
        {{ isReadOnly ? 'Close' : 'Cancel' }}
      </app-button>
      <app-button type="submit" [disabled]="isSaving" *ngIf="!isReadOnly">
        <lucide-icon name="save" [size]="16"></lucide-icon>
        {{ isSaving ? 'Saving...' : 'Save' }}
      </app-button>
    </div>
  </form>
</app-modal>
